services:
  mysql:
    image: mysql:8.4
    container_name: brain-tumor-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_super_secure_pass_2026}
      MYSQL_DATABASE: ${DB_NAME:-brain_tumor_db}
      MYSQL_USER: ${DB_USER:-brain_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-brain_secure_pass}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - brain-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER --password=$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: brain-tumor-ai-service
    restart: unless-stopped
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - MODEL_VERSION=efficientnetb4-v1
    ports:
      - "8000:8000"
    networks:
      - brain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brain-tumor-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-brain_tumor_db}
      - DB_USER=${DB_USER:-brain_user}
      - DB_PASSWORD=${DB_PASSWORD:-brain_secure_pass}
      - AI_SERVICE_URL=http://ai-service:8000
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - PORT=8080
    ports:
      - "${PORT:-8081}:8080"
    networks:
      - brain-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brain-tumor-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8081
    ports:
      - "3000:3000"
    networks:
      - brain-network

volumes:
  mysql_data:
    name: brain_tumor_mysql_data

networks:
  brain-network:
    driver: bridge
